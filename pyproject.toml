[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workshop"
version = "0.1.0"
description = "事件驱动的车间核心"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
workshop = "workshop.cli:main"

[project.entry-points."workshop.selector"]
ordered = "workshop.plugins.selectors.ordered:make_selector"
quota = "workshop.plugins.selectors.quota:make_selector"
experiment = "workshop.plugins.selectors.experiment:make_selector"

[project.entry-points."workshop.flow"]
issue_delivery = "workshop.plugins.issue_delivery:make_flow"
scheduled_release = "workshop.plugins.scheduled_release:make_flow"
watch_updates = "workshop.plugins.watch_updates:make_flow"
memory = "workshop.plugins.memory:make_flow"

[project.entry-points."workshop.memory"]
memory = "workshop.plugins.memory.port:make_memory"

[project.entry-points."workshop.source"]
github = "workshop.plugins.sources.github:make_source"
main_branch = "workshop.plugins.scheduled_release.source:make_source"
watch_updates = "workshop.plugins.watch_updates:make_source"

[project.entry-points."workshop.executor"]
orca-claude = "workshop.plugins.executors.local:make_orca_claude"
orca-codex = "workshop.plugins.executors.local:make_orca_codex"
codex = "workshop.plugins.executors.local:make_codex"
cursor-grok = "workshop.plugins.executors.local:make_cursor_grok"
claude = "workshop.plugins.executors.local:make_claude"

[project.entry-points."workshop.driver"]
claude = "workshop.plugins.executors.local.drivers.claude:Driver"
codex = "workshop.plugins.executors.local.drivers.codex:Driver"
cursor = "workshop.plugins.executors.local.drivers.cursor:Driver"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "import-linter>=2.1,<3",
    "pytest-xdist>=3.6,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "workshop"

[[tool.importlinter.contracts]]
name = "核心不引用插件"
type = "forbidden"
source_modules = ["workshop.core"]
forbidden_modules = ["workshop.plugins"]

[[tool.importlinter.contracts]]
name = "看门不引用插件"
type = "forbidden"
source_modules = ["workshop.watch"]
forbidden_modules = ["workshop.plugins"]

[project.entry-points."workshop.wait"]
intervention = "workshop.plugins.intervention.client:make_wait"

[[tool.importlinter.contracts]]
name = "核心不引用查看工具"
type = "forbidden"
source_modules = ["workshop.core"]
forbidden_modules = ["workshop.reports"]

[[tool.importlinter.contracts]]
name = "看门不引用查看工具"
type = "forbidden"
source_modules = ["workshop.watch"]
forbidden_modules = ["workshop.reports"]

[[tool.importlinter.contracts]]
name = "查看工具不引用插件"
type = "forbidden"
source_modules = ["workshop.reports"]
forbidden_modules = ["workshop.plugins"]
