[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workshop-intervention"
version = "0.1.0"
description = "独立介入点服务，不依赖车间主环境或核心状态库"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
workshop-intervention = "workshop.plugins.intervention.__main__:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../src/workshop/plugins/intervention" = "workshop/plugins/intervention"

"../../src/workshop/wait_client.py" = "workshop/wait_client.py"
