# 新 flows 只使用这里的条件；兼容旧 plugin 文件的默认条件留在流程迁移适配中。
issue_triggers: &issue_triggers
  - source: github
    when: {kind: label, label: Ready for Agent, actor: kun-g, by_workshop: false, edited: false}
    action: ready
  - source: github
    when:
      kind: [issue-comment, pr-comment, pr-review-comment, pr-review]
      author: kun-g
      text: '^不对(?:[，,:：。！!\s][\s\S]*)?$'
      by_workshop: false
      edited: false
    action: rework
  - {source: github, action: update}
  - {source: 'cli:feishu', action: update}
  - {source: 'cli:orca', action: update}
# 唯一规则入口；插件通过 workshop.<port> 入口点按名字加载。
targets:
  grant-console:
    default_flow: issue_delivery
    flows:
      issue_delivery: {triggers: *issue_triggers}
    selector: quota
    # 本机 ai_quota 快照（和 ai-quota MCP 同一数据源），只读；最近一次成功采集超过 45 分钟算过期（和 ai_quota 提醒同一条线）。
    quota_snapshot: &quota_snapshot {path: ~/.local/state/ai_quota/quota.db, max_age_minutes: 45}
    # 阶段开关：去掉审查（Kun 11-13：「先跳过 Review 加快交付，反正现在的系统是我自己在用」）。要恢复就把审查加回证据和交付之间。
    stages: [接单, 说清楚, 执行, 证据, 交付, 验收, 收尾]
    sources: [github]
    github_overlap_seconds: 60
    repo: kun-g/grant-console
    github_identity: {mode: inherit}
    requirement_docs: ['docs/requirements/']
    # 仅作为证据/审查 clone 的只读来源；发布在插件状态目录 releases/ 的专用检出。
    checkout: ~/workspace/runtime/repos/grant-console
    skill: issue-delivery
    permissions: repository
    label: Ready for Agent
    # grant-console 开发；按群编号匹配，不把群名当凭据。
    feishu_chat_id: oc_b518118e43fc373572b6efb5e1887e2b
    feishu_profile: tuan
    kun_feishu_open_id: ou_43456ed5ae17472375fcbb6ec0fc4661
    ask_kun_state: ~/.local/state/ask-kun/asks.json
    pending_limit: 5
    short_name: gc
    ci: [check-and-build]
    prepare:
      - {argv: [uv, sync, --locked], cwd: services/devops-console}
    check_timeout: 900
    bot_review:
      login: lambdatheory-agent[bot]
      signer: [~/workspace/runtime/tools/agent_github_identity/.venv/bin/python, -I, ~/workspace/runtime/tools/agent_github_identity/agent_gh_token.py]
    tag_command: [scripts/tag-release.sh]
    release_timeout: 300
    deployment:
      context: central-admin-agent
      namespace: argocd
      app: grant-console-centaladmin
      revision_field: status.sync.revision
      branch: production
      release_file: release.json
      source_field: source_commit
      # 回查要求这个 Deployment 换版完成（同 kubectl rollout status 的判定）；只读 get，不删 Pod。
      rollout: {namespace: agent-ops, name: grant-console}
    release: tag
    # 交付说明里的发版手册：交付提交里有这个文件就照它发；没有（grant-console#143 合并前）就用回退文本。
    release_runbook: docs/runbooks/sync-production.md
    release_runbook_fallback: 照 issue kun-g/grant-console#143 正文的步骤
    # 前缀匹配仓库根起的相对路径。名单由 grant-console 负责会话 11-13 给出。
    two_reviewers: ['.github/', 'deploy/', 'scripts/', 'services/devops-console/grant_console/',
                    'services/devops-console/k8s/', 'docs/ci.md', 'docs/runbooks/release.md']
    # 冻结：自动部署那条线收尾前不改，除非 Kun 单独放行（grant-console 负责会话 11-13）。前缀匹配同 two_reviewers。
    frozen_paths: ['.github/', 'deploy/', 'docs/ci.md', 'docs/runbooks/release.md']
    # 串行：审批卡的渲染和回调，碰到的活一件一件过执行（grant-console 负责会话 11-13；按 main e18321a 核过）。
    # app.py 的 grant_decision 处理审批卡回调，整份列入：碰 app.py 的活都会排队。
    # 仓库里没有 cards/ 目录，故不列。
    serial_paths: ['services/devops-console/grant_console/notifications.py',
                   'services/devops-console/grant_console/app.py',
                   'services/devops-console/grant_console/approval_display.py',
                   'services/devops-console/grant_console/assets/icons/',
                   'services/devops-console/grant_console/lark_receiver.py',
                   'services/lark-event-daemon/',
                   'tools/lark_card_render.py',
                   'services/devops-console/tests/test_card_',
                   'services/devops-console/tests/test_lark_receiver.py',
                   'docs/requirements/approval-card.md']
  workshop:
    default_flow: issue_delivery
    flows:
      issue_delivery: {triggers: *issue_triggers}
    selector: quota
    quota_snapshot: *quota_snapshot
    # 阶段开关：去掉审查（Kun 11-13：「先跳过 Review 加快交付，反正现在的系统是我自己在用」）。要恢复就把审查加回证据和交付之间。
    stages: [接单, 说清楚, 执行, 证据, 交付, 验收, 收尾]
    sources: [github]
    github_overlap_seconds: 60
    short_name: ws
    ask_kun_state: ~/.local/state/ask-kun/asks.json
    ci: none
    prepare: [{argv: [uv, sync, --locked]}]
    check_timeout: 300
    bot_review: false
    repo: kun-g/workshop
    github_identity:
      mode: app
      gh: /opt/homebrew/bin/gh
      signer: [~/workspace/runtime/repos/workshop/.venv/bin/python, -m, workshop.github_token,
               --config, ~/workspace/runtime/tools/agent_github_identity/config.json,
               --app, lambdatheory-agent, --key-service, lambdatheory-agent, --key-account, private-key]
    requirement_docs: ['docs/requirements/核心.md', 'docs/requirements/issue交付.md', 'docs/requirements/定时发版.md']
    checkout: ~/workspace/runtime/repos/workshop
    skill: issue-delivery
    permissions: repository
    label: Ready for Agent
    # 交付对象就是车间自己：合并后快进 checkout（主检出）并让守护进程这一拍后退出，由 launchd 拉起。
    release: self
# 配置档集中定义；use 是持久身份，不随 driver 或运行方式改变。
executor_profiles:
  orca-codex:
    driver: codex
    transport: orca
    family: codex
    billing: subscription
    model: gpt-6-astra
    effort: high
    sandbox: danger-full-access
    permission_mode: never
    model_provider: openai
    quota: {provider: codex, window: Weekly, min_remaining: 15, label: Codex 周额度}
  orca-claude:
    driver: claude
    transport: orca
    family: claude
    billing: subscription
    model: claude-opus-5-5
    effort: high
    permission_mode: bypassPermissions
  # 只读审查：沿用旧 use 名，以便在途会话照常接回。
  codex:
    driver: codex
    transport: headless
    family: codex
    billing: subscription
    model: gpt-6.1-sol
    effort: high
    sandbox: read-only
    permission_mode: never
    ignore_user_config: true
    ignore_rules: true
  cursor-grok:
    driver: cursor
    transport: headless
    family: grok
    billing: subscription
    permission_mode: plan
  claude:
    driver: claude
    transport: headless
    family: claude
    billing: subscription
    permission_mode: plan
    restricted: true
    tools: [Read, Glob, Grep]
    strict_mcp_config: true
    mcp_config: {mcpServers: {}}
    first_when_writer: [codex]
executors:
  writer: [{use: orca-codex}, {use: orca-claude}]
  reviewer: [{use: codex}, {use: cursor-grok}, {use: claude}]
  acceptor: [{use: codex}, {use: claude}]
limits: {concurrent: 5, chain_depth: 8, round_timeout_seconds: 7200}
# 所有阶段默认用 quota；没有额度门槛时它和 ordered 一样按顺序取第一个。
selector: quota
channel: ask_kun
# 通知开关：hold 只记不发（Kun 11-14：「自从你们这边开始用Ash给我发消息，里面全是垃圾消息。我已经不想看了」）。要 Kun 定的事走问卡，不受影响。
notices: hold
ask_first:
  - 对外发消息
  - 删别处的东西
  - 花订阅以外的钱
  - 有别人在用的交付对象上线
skip_ask:
  - 只有你在用的交付对象上线

# 阶段可单独指定候选；省略时沿用 writer/reviewer/acceptor。
stage_executors: {}
