# 唯一规则入口；插件通过 workshop.<port> 入口点按名字加载。
targets:
  grant-console:
    plugin: issue_delivery
    selector: ordered
    stage_selectors: {审查: ordered}
    sources: [github]
    repo: kun-g/grant-console
    checkout: ~/workspace/runtime/repos/grant-console
    skill: issue-delivery
    permissions: repository
    label: Ready for Agent
    # grant-console 开发；按群编号匹配，不把群名当凭据。
    feishu_chat_id: oc_b518118e43fc373572b6efb5e1887e2b
    feishu_profile: tuan
    kun_feishu_open_id: ou_43456ed5ae17472375fcbb6ec0fc4661
    ask_kun_state: ~/.local/state/ask-kun/asks.json
    pending_limit: 5
    deployment: {app: grant-console-centaladmin}  # 只读回查用本机 Argo 上下文；部署另用获批身份
    release: tag
    two_reviewers: ['.github/', 'deploy/', 'grant_console/']
  workshop:
    plugin: issue_delivery
    selector: ordered
    stage_selectors: {审查: ordered}
    sources: [github]
    repo: kun-g/workshop
    checkout: ~/workspace/runtime/repos/workshop
    skill: issue-delivery
    permissions: repository
    label: Ready for Agent
    release: none
executors:
  writer: {use: orca-claude, family: claude, billing: subscription, model: claude-opus-5-5, effort: high}
  reviewer:
    - {use: cursor-grok, family: grok, billing: subscription}
    - {use: codex, family: codex, billing: subscription}
    - {use: claude, family: claude, billing: subscription}
  acceptor:
    - {use: codex, family: codex, billing: subscription}
    - {use: claude, family: claude, billing: subscription}
limits: {concurrent: 2, chain_depth: 8, round_timeout_seconds: 7200}
selector: ordered
stage_selectors: {执行: ordered}
channel: ask_kun
ask_first:
  - 对外发消息
  - 删别处的东西
  - 花订阅以外的钱
  - 有别人在用的交付对象上线
skip_ask:
  - 只有你在用的交付对象上线

# 阶段可单独指定候选；省略时沿用 writer/reviewer/acceptor。
stage_executors: {}
